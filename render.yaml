services:
  - type: web
    name: booster-discord-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: PREFIX
        value: "$"
      - key: OWNER_IDS
        value: "1505515188991033409"

