discord:
  webhook_url: ""
  bot_token: ""         # Paste your Discord Bot Token here (from Discord Developer Portal)
  prefix: "$"           # Command prefix (e.g., $boost)

extras:
  use_log: true

  captcha_solver:
    solve_captcha: false
    use: "capsolver"
    hcoptcha_api_key: ""
    capsolver_api_key: ""
    csolver_key: ""
    dchcaptcha_api_key: ""
    max_retries: 5

customizations:
  enable: false
